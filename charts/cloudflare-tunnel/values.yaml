# Default values for cloudflare-tunnel.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Args for the container entrypoint
args: []

# -- Secret environment variables.
# Uses if not set the envSecretName
envs: {}

# -- Deployment environment variables
env: []
  # - name: TUNNEL_REGION
  #   value: edge

# -- Pods Service Account.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations for pod.
# ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# -- Pod Security Context.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: "OnRootMismatch"

# -- Container Security Context.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true

# -- Network Policy parameters.
# ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy:
  # -- Enable egress filtering: allow cluster DNS, tunnel connections, and HTTPS. Add rules for origin services using extraEgress.
  enabled: false

  dns:
    # -- Namespace selector for cluster DNS pods.
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    # -- Pod selector for cluster DNS (CoreDNS and kube-dns).
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    # -- Additional DNS resolver CIDRs allowed on TCP/UDP port 53, for example a DNS service IP or NodeLocal DNS address.
    ipBlocks: []

  # -- Additional egress rules for origin services or other destinations.
  extraEgress: []

# -- Resource requests and limits.
# ref: https://kubernetes.io/docs/user-guide/compute-resources/
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- This is to setup the startup probes
# refs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe:
  httpGet:
    scheme: HTTP
    path: /ready
    port: metrics
  initialDelaySeconds: 5
  timeoutSeconds: 1
  failureThreshold: 60
  successThreshold: 1
  periodSeconds: 5

# -- This is to setup the liveness probes
# refs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
  # httpGet:
  #   scheme: HTTP
  #   path: /ready
  #   port: metrics
  # initialDelaySeconds: 120
  # timeoutSeconds: 1
  # failureThreshold: 3
  # successThreshold: 1
  # periodSeconds: 60

# -- This is to setup the readiness probes
# refs: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readinessProbe: {}
  # httpGet:
  #   scheme: HTTP
  #   path: /ready
  #   port: metrics
  # initialDelaySeconds: 5
  # timeoutSeconds: 2
  # failureThreshold: 3
  # successThreshold: 1
  # periodSeconds: 60

# -- Controller deployment update strategy type.
# ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# -- Node labels for controller assignment.
# ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

# -- Tolerations for controller assignment.
# ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Pod Anti Affinity
# soft/hard
podAntiAffinityPreset: soft
podAntiAffinityPresetKey: kubernetes.io/hostname

# -- Affinity for controller assignment.
# ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

metrics:
  enabled: false
