{{- if .Values.derp.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "headscale.fullname" . }}-derp
  labels:
    {{- include "headscale.labels" . | nindent 4 }}
    app.kubernetes.io/component: derp
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 30%
  selector:
    matchLabels:
      {{- include "headscale.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: derp
  template:
    metadata:
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "headscale.labels" . | nindent 8 }}
        app.kubernetes.io/component: derp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "headscale.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-derp
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.derp.image.repository }}:{{ .Values.derp.image.tag | default (printf "%s-derp" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.derp.image.pullPolicy }}
          command:
            - /app/derper
          args:
            - --hostname=derp.bmhub.io
            - --home=blank
            - --certmode=manual
            - --certdir=/etc/certs
            - --c=/tmp/derper.key
            - --stun=true
            - --a=:{{ .Values.derp.ports.https }}
            - --http-port=-1
            - --stun-port={{ .Values.derp.ports.stun }}
            - --verify-clients=false
          ports:
            - name: https
              containerPort: {{ .Values.derp.ports.https }}
              hostPort: {{ .Values.derp.ports.https }}
              protocol: TCP
            - name: stun
              containerPort: {{ .Values.derp.ports.stun }}
              hostPort: {{ .Values.derp.ports.stun }}
              protocol: TCP
          {{- with .Values.derp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: keys
              mountPath: /etc/certs
            - name: run
              mountPath: /tmp
      volumes:
      {{- if .Values.derp.tls.secretName }}
        - name: keys
          secret:
            secretName: {{ .Values.derp.tls.secretName }}
            items:
              - key: tls.key
                path: {{ .Values.derp.tls.host }}.key
              - key: tls.crt
                path: {{ .Values.derp.tls.host }}.crt
        {{- end }}
        - name: run
          emptyDir: {}
      {{- with .Values.derp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.derp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.derp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
