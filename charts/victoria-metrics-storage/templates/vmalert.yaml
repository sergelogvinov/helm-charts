apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: {{ include "victoria-metrics-storage.fullname" . }}
  labels:
    {{- include "victoria-metrics-storage.labels" . | nindent 4 }}
spec:
  disableAutomountServiceAccountToken: true
  priorityClassName: {{ .Values.priorityClassName | quote }}
  {{- if not .Values.vmAlert.autoscaling.enabled }}
  replicaCount: {{ .Values.vmAlert.replicaCount }}
  {{- end }}
  {{- with .Values.vmAlert.image }}
  image:
    {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if or .Values.podAnnotations .Values.podLabels }}
  podMetadata:
    {{- with .Values.podAnnotations }}
    annotations:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.podLabels }}
    labels:
      {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}

  useStrictSecurity: true
  selectAllByDefault: false
  evaluationInterval: "60s"

  secrets:
    {{- toYaml .Values.vmAlert.secrets | nindent 4 }}
  configMaps:
    {{- toYaml .Values.vmAlert.configMaps | nindent 4 }}
  rulePath:
    {{- toYaml .Values.vmAlert.rulePath | nindent 4 }}

  extraArgs:
    {{- toYaml .Values.vmAlert.extraArgs | nindent 4 }}
  logLevel: INFO

  datasource:
    url: "http://vmselect-{{ include "victoria-metrics-storage.fullname" . }}:8481/select/0/prometheus/"
  remoteWrite:
    url: "http://vminsert-{{ include "victoria-metrics-storage.fullname" . }}:8480/insert/0/prometheus/"
  remoteRead:
    url: "http://vmselect-{{ include "victoria-metrics-storage.fullname" . }}:8480/insert/0/prometheus/"
  notifier:
    url: "http://prometheus-alertmanager:9093"

  {{- with .Values.vmAlert.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.vmAlert.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.vmAlert.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.vmAlert.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
