{{- if and .Values.loadbalancer.autoscaling.enabled (.Capabilities.APIVersions.Has "autoscaling.k8s.io/v1") }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "keydb.fullname" . }}-loadbalancer
  labels:
    {{- include "keydb.loadbalancer.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "keydb.fullname" . }}-loadbalancer
  updatePolicy:
    updateMode: {{ .Values.loadbalancer.autoscaling.updatePolicy.updateMode }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Chart.Name }}
        {{- with (merge .Values.loadbalancer.autoscaling.maxAllowed .Values.loadbalancer.resources.limits) }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with (merge .Values.loadbalancer.autoscaling.minAllowed .Values.loadbalancer.resources.requests) }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.loadbalancer.autoscaling.controlledResources }}
        controlledResources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.loadbalancer.autoscaling.controlledValues }}
        controlledValues: {{ . }}
        {{- end }}
{{- end }}
